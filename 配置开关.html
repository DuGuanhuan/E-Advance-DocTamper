
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台配置 - 内审图像鉴伪辅助平台</title>
    <style>
        /* --- 全局样式 (保持一致性) --- */
        :root {
            --primary-color: #4A90E2;
            --secondary-color: #F5F7FA;
            --border-color: #DCE1E6;
            --text-color: #333;
            --text-light-color: #777;
            --success-color: #2E7D32;
            --font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
            --card-shadow: 0 4px 12px rgba(0,0,0,0.08);
            --border-radius: 8px;
        }
        body { font-family: var(--font-family); margin: 0; background-color: var(--secondary-color); color: var(--text-color); line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        header { background-color: #fff; padding: 16px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        header h1 { color: #333; font-size: 24px; margin: 0; }
        header .sub-title { color: var(--text-light-color); font-size: 14px; margin-left: 12px; }
        nav a { color: var(--text-light-color); text-decoration: none; margin-left: 20px; font-weight: 500; }
        nav a.active { color: var(--primary-color); }
        .btn { background-color: var(--primary-color); color: #fff; border: none; padding: 10px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: 500; transition: background-color 0.3s; }
        .btn:hover { background-color: #357ABD; }
        
        /* --- 页面特定样式 --- */
        .page-header h2 { font-size: 28px; margin: 0 0 24px; }
        .config-card {
            background-color: #fff;
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            margin-bottom: 24px;
        }
        .card-header { font-size: 18px; font-weight: 600; padding: 20px 24px; border-bottom: 1px solid var(--border-color); }
        .card-body { padding: 24px; }
        
        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--secondary-color);
        }
        .setting-item:last-child { border-bottom: none; }
        .setting-info h4 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
        .setting-info p { margin: 0; font-size: 14px; color: var(--text-light-color); }

        /* --- 开关 Toggle Switch --- */
        .toggle-switch { position: relative; display: inline-block; width: 50px; height: 28px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; border-radius: 28px; transition: .4s; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; border-radius: 50%; transition: .4s; }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(22px); }

        /* --- 风险阈值配置 --- */
        .threshold-config { display: flex; align-items: center; gap: 15px; }
        .threshold-config label { font-weight: 500; }
        .threshold-config input[type="number"] { width: 80px; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; }
        
        .action-footer {
            margin-top: 24px;
            padding: 20px;
            background-color: #fff;
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            text-align: right;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>管理后台</h1>
            <span class="sub-title">内审图像鉴伪辅助平台</span>
        </div>
        <nav>
            <a href="#" class="active">系统配置</a>
            <a href="#">用户管理</a>
            <a href="#">操作日志</a>
            <a href="task_list.html">返回前台 &rarr;</a>
        </nav>
    </header>

    <div class="container">
        <div class="page-header">
            <h2>系统配置管理</h2>
        </div>
        
        <div class="config-card">
            <div class="card-header">检测引擎配置</div>
            <div class="card-body">
                <div class="setting-item">
                    <div class="setting-info">
                        <h4>历史相似图比对</h4>
                        <p>启用后，系统会对比历史图片库，快速发现旧图新改。性能消耗中等。</p>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="setting-item">
                    <div class="setting-info">
                        <h4>OCR 模板校验</h4>
                        <p>对特定版式的票据进行版式和字段交叉验证。性能消耗较高，需预先配置模板。</p>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                 <div class="setting-item">
                    <div class="setting-info">
                        <h4>EXIF 元数据分析</h4>
                        <p>分析图片元数据以发现P图软件痕跡。性能消耗低，建议始终开启。</p>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="setting-item">
                    <div class="setting-info">
                        <h4>AI 深度篡改检测</h4>
                        <p>使用深度学习模型分析像素级篡改痕迹。性能消耗高，成本也较高。</p>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>

        <div class="config-card">
            <div class="card-header">风险阈值配置</div>
            <div class="card-body">
                <div class="setting-item">
                     <div class="setting-info">
                        <h4>风险等级阈值</h4>
                        <p>调整分数区间以定义高、中、低风险。分数越高代表风险越大。</p>
                    </div>
                    <div class="threshold-config">
                        <label for="high-risk">高风险 &gt;</label>
                        <input type="number" id="high-risk" value="70">
                        <label for="medium-risk">中风险 &gt;</label>
                        <input type="number" id="medium-risk" value="30">
                    </div>
                </div>
            </div>
        </div>
        
        <div class="action-footer">
            <button class="btn">保存更改</button>
        </div>
    </div>
</body>
</html>
