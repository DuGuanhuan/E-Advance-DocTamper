<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>审核任务列表 - 内审图像鉴伪辅助平台</title>
    <style>
        /* --- 全局样式 (与之前相同，保持一致性) --- */
        :root {
            --primary-color: #4A90E2;
            --secondary-color: #F5F7FA;
            --border-color: #DCE1E6;
            --text-color: #333;
            --text-light-color: #777;
            --high-risk-color: #D0021B;
            --medium-risk-color: #F5A623;
            --low-risk-color: #2E7D32;
            --font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
            --card-shadow: 0 4px 12px rgba(0,0,0,0.08);
            --border-radius: 8px;
        }
        body { font-family: var(--font-family); margin: 0; background-color: var(--secondary-color); color: var(--text-color); line-height: 1.6; }
        .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
        header { background-color: #fff; padding: 16px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        header h1 { color: var(--primary-color); font-size: 24px; margin: 0; }
        nav a { color: var(--text-light-color); text-decoration: none; margin-left: 20px; font-weight: 500; }
        nav a.active { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 4px; }
        .card { background-color: #fff; border-radius: var(--border-radius); box-shadow: var(--card-shadow); padding: 24px; margin-top: 24px;}
        .card-header { font-size: 18px; font-weight: 600; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
        .btn { background-color: var(--primary-color); color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: 500; transition: background-color 0.3s; }
        .btn:hover { background-color: #357ABD; }
        
        /* --- 页面特定样式 --- */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header h2 {
            font-size: 28px;
            margin: 0;
            color: #333;
        }

        .filter-bar {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            align-items: center;
        }
        .filter-bar input, .filter-bar select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 14px;
        }
        
        /* --- 任务列表表格样式 --- */
        .task-table { width: 100%; border-collapse: collapse; }
        .task-table th, .task-table td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border-color); }
        .task-table th { font-weight: 600; color: var(--text-light-color); font-size: 14px; background-color: #F8F9FA; }
        .task-table tbody tr:hover { background-color: #EBF2FA; }
        .task-table a { color: var(--primary-color); text-decoration: none; font-weight: 500; }
        .task-table a:hover { text-decoration: underline; }
        
        .status-tag { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; color: #fff; display: inline-block; }
        .status-high { background-color: var(--high-risk-color); }
        .status-medium { background-color: var(--medium-risk-color); }
        .status-low { background-color: var(--low-risk-color); }
        .status-processing { background-color: #9B9B9B; }
    </style>
</head>
<body>
    <header>
        <h1>内审图像鉴伪辅助平台</h1>
        <nav>
            <a href="#" class="active">审核任务</a>
            <a href="#">案例库</a>
            <a href="#">个人中心</a>
        </nav>
    </header>

    <div class="container">
        <div class="page-header">
            <h2>审核任务列表</h2>
            <button class="btn">新建审核任务</button>
        </div>

        <div class="card">
            <div class="filter-bar">
                <input type="text" placeholder="搜索文件名或任务ID...">
                <select>
                    <option value="">所有状态</option>
                    <option value="high">高风险</option>
                    <option value="medium">中风险</option>
                    <option value="low">低风险</option>
                </select>
                <button class="btn">筛选</button>
            </div>
            
            <table class="task-table">
                <thead>
                    <tr>
                        <th>任务ID</th>
                        <th>文件名</th>
                        <th>风险等级</th>
                        <th>负责人</th>
                        <th>上传时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>TSK-001</td>
                        <td><a href="analysis_report.html">INV202509001.jpg</a></td>
                        <td><span class="status-tag status-high">高风险</span></td>
                        <td>张三</td>
                        <td>2025-09-04 14:30</td>
                        <td><a href="analysis_report.html">查看报告</a></td>
                    </tr>
                    <tr>
                        <td>TSK-002</td>
                        <td><a href="#">差旅报销单.pdf</a></td>
                        <td><span class="status-tag status-low">低风险</span></td>
                        <td>李四</td>
                        <td>2025-09-04 11:15</td>
                        <td><a href="#">查看报告</a></td>
                    </tr>
                    <tr>
                        <td>TSK-003</td>
                        <td><a href="#">合同扫描件_final.png</a></td>
                        <td><span class="status-tag status-medium">中风险</span></td>
                        <td>张三</td>
                        <td>2025-09-03 18:05</td>
                        <td><a href="#">查看报告</a></td>
                    </tr>
                     <tr>
                        <td>TSK-004</td>
                        <td><a href="#">设备采购发票.jpg</a></td>
                        <td><span class="status-tag status-processing">处理中</span></td>
                        <td>王五</td>
                        <td>2025-09-04 14:32</td>
                        <td><a href="#">查看报告</a></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
