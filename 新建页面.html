<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新建审核任务 - 内审图像鉴伪辅助平台</title>
    <style>
        /* --- 全局样式 (与之前相同，保持一致性) --- */
        :root {
            --primary-color: #4A90E2;
            --secondary-color: #F5F7FA;
            --border-color: #DCE1E6;
            --text-color: #333;
            --text-light-color: #777;
            --success-color: #2E7D32;
            --danger-color: #D0021B;
            --font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
            --card-shadow: 0 4px 12px rgba(0,0,0,0.08);
            --border-radius: 8px;
        }
        body { font-family: var(--font-family); margin: 0; background-color: var(--secondary-color); color: var(--text-color); line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        header { background-color: #fff; padding: 16px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        header h1 { color: var(--primary-color); font-size: 24px; margin: 0; }
        nav a { color: var(--text-light-color); text-decoration: none; margin-left: 20px; font-weight: 500; }
        nav a.active { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 4px; }
        .card { background-color: #fff; border-radius: var(--border-radius); box-shadow: var(--card-shadow); padding: 32px; margin-top: 24px;}
        .btn { background-color: var(--primary-color); color: #fff; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: 500; transition: background-color 0.3s; display: inline-flex; align-items: center; gap: 8px;}
        .btn:hover { background-color: #357ABD; }
        .btn-secondary { background-color: #fff; color: var(--text-light-color); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background-color: #f8f9fa; color: var(--text-color); border-color: #ccc; }
        
        /* --- 页面特定样式 --- */
        .breadcrumb { margin-bottom: 24px; font-size: 14px; }
        .breadcrumb a { color: var(--primary-color); text-decoration: none; }
        .breadcrumb span { color: var(--text-light-color); margin: 0 8px; }
        
        .form-section { margin-bottom: 28px; }
        .form-section label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 16px; }

        /* --- 文件上传区域 --- */
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: var(--border-radius);
            padding: 40px;
            text-align: center;
            background-color: #F8F9FA;
            transition: background-color 0.3s, border-color 0.3s;
        }
        .upload-area.drag-over {
            background-color: #EBF2FA;
            border-color: var(--primary-color);
        }
        .upload-area .upload-icon { font-size: 48px; color: var(--primary-color); }
        .upload-area p { margin: 12px 0 20px; color: var(--text-light-color); font-size: 16px; }

        /* --- 文件列表 --- */
        .file-list-container { margin-top: 24px; }
        .file-list-header { font-weight: 600; color: var(--text-color); margin-bottom: 12px; }
        .file-list-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background-color: #F8F9FA;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 8px;
        }
        .file-list-item .file-icon { margin-right: 12px; font-size: 24px; }
        .file-list-item .file-info { flex-grow: 1; }
        .file-list-item .file-name { font-weight: 500; }
        .file-list-item .file-size { font-size: 12px; color: var(--text-light-color); }
        .file-list-item .remove-btn {
            color: var(--danger-color);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .form-actions {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
            text-align: right;
            display: flex;
            justify-content: flex-end;
            gap: 16px;
        }
    </style>
</head>
<body>
    <header>
        <h1>内审图像鉴伪辅助平台</h1>
        <nav>
            <a href="task_list.html" class="active">审核任务</a>
            <a href="#">案例库</a>
            <a href="#">个人中心</a>
        </nav>
    </header>

    <div class="container">
        <div class="breadcrumb">
            <a href="task_list.html">审核任务</a>
            <span>&gt;</span>
            新建审核任务
        </div>

        <div class="card">
            <form>
                <div class="form-section">
                    <label>上传审核文件</label>
                    <div class="upload-area" id="upload-area">
                        <div class="upload-icon">📄</div>
                        <p>将文件拖拽到此处，或点击下方按钮选择</p>
                        <button type="button" class="btn">
                           <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/><path d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708l3-3z"/></svg>
                            选择文件
                        </button>
                    </div>
                </div>

                <div class="file-list-container" id="file-list-container">
                    <div class="file-list-header">待上传文件 (2)</div>
                    <div class="file-list-item">
                        <span class="file-icon">🖼️</span>
                        <div class="file-info">
                            <div class="file-name">INV202509001.jpg</div>
                            <div class="file-size">1.2 MB</div>
                        </div>
                        <button type="button" class="remove-btn">×</button>
                    </div>
                    <div class="file-list-item">
                        <span class="file-icon">📄</span>
                        <div class="file-info">
                            <div class="file-name">出差申请单扫描件.pdf</div>
                            <div class="file-size">856 KB</div>
                        </div>
                        <button type="button" class="remove-btn">×</button>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary">取消</button>
                    <button type="submit" class="btn">提交审核任务</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        // 简单的JS模拟拖拽效果
        const uploadArea = document.getElementById('upload-area');
        
        uploadArea.addEventListener('dragover', (event) => {
            event.preventDefault();
            uploadArea.classList.add('drag-over');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('drag-over');
        });
        
        uploadArea.addEventListener('drop', (event) => {
            event.preventDefault();
            uploadArea.classList.remove('drag-over');
            // 在这里处理文件上传逻辑，例如获取 event.dataTransfer.files
            // 此处为静态演示，不实现具体功能
            alert('文件已“放置”，实际应用中将在这里处理文件列表。');
        });
    </script>
</body>
</html>
